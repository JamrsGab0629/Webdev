name: 🤖 Trigger Central AI Bot

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize ]
  issue_comment:
    types: [ created ]

jobs:
  call-central-pipeline:
    # 🎯 Points directly to your central Github-Automation repo
    uses: JamrsGab0629/Github-Automation/.github/workflows/daily-update.yml@main
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}